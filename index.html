FR[222]=["« Nous avons respecté les exigences de sécurité aérienne »","Ce n'est pas l'exonération de conformité : il faut qu'une règle impérative précise ait elle-même causé le défaut. Le 737 MAX n'est pas un cas (d). La certification n'exclut pas le défaut.","","En clair : certifié ≠ non défectueux.\n\nExemple : une règle qui impose un dispositif qui est lui-même le défaut → (d) possible.\n\nAstuce : très souvent testé."];
FR[223]=["Nouvelle directive art. 11(2)","Pas d'exonération si le défaut vient d'un service connexe, d'un logiciel y compris les mises à jour, d'une mise à jour de sécurité manquante, ou d'une modification substantielle — si sous le contrôle du fabricant.","","En clair : le fabricant reste responsable de ses logiciels après la vente.\n\nExemple MediLift : mise à jour manquante sous contrôle de QJI → pas d'échappatoire."];
FR[224]=["Preuve : art. 9–10 nouvelle directive","Ordres de divulgation. Défaut présumé si refus de divulguer, non-conformité aux règles de sécurité, ou dysfonctionnement manifeste en usage normal. Causalité présumée si dommage typiquement lié au défaut. Les deux si complexité excessive.","","En clair : la victime a beaucoup moins à prouver qu'avant.\n\nExemple : fabricant qui ignore l'ordre de divulgation → défaut présumé."];
FR[225]=["3 · 10 · 25 ans","Directive produits : prescription 3 ans à compter de la connaissance · forclusion 10 ans après la mise sur le marché · 25 ans pour une lésion corporelle latente.","","En clair : trois délais à ne pas confondre.\n\nLien : Howald Moor v. Suisse (CEDH, amiante) pour la critique des délais absolus."];
FR[226]=["Drone MediLift (fabriqué par QJI en Chine, importé par Torenhoge, détenu par ABC, exploité par Skywings) s'écrase. Qui est responsable selon la directive produits ?","QJI (fabricant) et Torenhoge (importateur) — art. 8. ABC, Skywings et le télépilote ne sont pas des opérateurs économiques au sens de la directive : autres fondements (règles nationales propriétaire/exploitant, faute).","","En clair : c'est le cas pratique du cours 23.\n\nPlan : personnes responsables → dommage → défaut et exonérations → preuve (art. 9–10) → mise à jour manquante (art. 11(2)).\n\nAstuce : la conformité aux règles aériennes n'exclut pas le défaut."];
FR[227]=["","Du lien contractuel à la négligence envers le consommateur final (roue qui se brise ; escargot dans la bouteille de ginger beer).","Puis responsabilité objective après la thalidomide.","En clair : l'histoire de la responsabilité produits en deux arrêts.\n\nAstuce : pour une introduction de dissertation."];
FR[228]=["Retirée : la directive sur la responsabilité en matière d'IA","Retirée le 6.10.2025.","","En clair : il n'y a pas de régime spécial de responsabilité pour l'IA dans l'UE.\n\nAstuce : la nouvelle directive produits couvre les logiciels, y compris l'IA."];
FR[229]=["Pourquoi attaquer le constructeur ?","Il n'est pas protégé par les plafonds et l'exclusivité des conventions ; aux États-Unis, dommages punitifs, jurys, discovery. Mais le forum non conveniens peut renvoyer les demandes (AF447).","","En clair : c'est la poche la plus profonde, sans plafond.\n\nAstuce : étape 5 de la méthode."];
FR[230]=["Enquêtes Annexe 13","But : prévention, pas recherche de responsabilité. L'État d'occurrence mène l'enquête. Les recommandations ne sont pas des constats de faute (« just culture »).","Tension avec les procureurs en France, Italie, Brésil.","En clair : le rapport BEA n'est pas un jugement.\n\nPiège : ne pas dire que le rapport établit la faute."];
FR[231]=["Navigabilité « continued » v. « continuing »","Continued = le constructeur (notifications, condition dangereuse, consignes de navigabilité AESA). Continuing = l'exploitant. Part 21 : certificat de type (conception) v. certificat de navigabilité (individuel).","","En clair : deux mots presque identiques, deux responsables différents.\n\nAstuce : « continued → constructeur »."];
FR[232]=["","Lamelle de titane perdue par un DC-10 de Continental → pneu éclaté → incendie. Continental et son mécanicien condamnés (2010), relaxés en appel (2012, prévisibilité) ; responsabilité civile maintenue.","","En clair : relaxe pénale mais responsabilité civile.\n\nAstuce : Aérospatiale et la DGAC aussi relaxés."];
FR[233]=["","États-Unis : forum non conveniens. France : relaxe (2023), condamnation en appel (21.5.2026), pourvoi pendant devant la Cour de cassation.","","En clair : un crash, des procédures dans plusieurs pays pendant plus de 15 ans.\n\nAstuce : AF447 = forum non conveniens + pénal."];
FR[234]=["","L'action en contribution d'Airbus contre la compagnie échappe aux Conventions de Varsovie/Montréal.","","En clair : le constructeur qui se retourne contre la compagnie n'est pas limité par MC99.\n\nAstuce : contribution claims = hors conventions."];
FR[235]=["","Un incident, aucun blessé, trois procédures : arbitrage CCI, action délictuelle italienne bloquée par un jugement anglais, procès pénal de six ans classé.","","En clair : même un incident sans victime peut déclencher civil, arbitral et pénal.\n\nAstuce : réponse à « quelles procédures peuvent suivre ? »."];
FR[236]=["","Actions en responsabilité produits (~2,15 Md GBP) sous le Consumer Protection Act 1987 et en négligence ; défense d'approbation réglementaire ; divulgation des données de vol.","","En clair : exemple anglais de l'ancienne directive transposée.\n\nAstuce : à citer pour les produits déjà en service."];
FR[237]=["L'assurance en une carte","Transfère un risque existant et aléatoire contre une prime, à un assuré ayant un intérêt assurable ; indemnise sans enrichir (Prudential v. IRC, 1904).","Droit anglais : bonne foi maximale → devoir de présentation loyale (Insurance Act 2015).","En clair : l'assurance ne crée pas de risque (contrairement au jeu), elle le transfère.\n\nAstuce : aléa + intérêt assurable + indemnité."];
FR[238]=["Le marché londonien","Courtier (obligatoire à Londres) place le risque avec un slip → apériteur (~30 %) fixe les conditions → coassureurs jusqu'à 100 % → réassurance facultative ou par traité. Lloyd's = société et place de marché, pas une compagnie.","Captives : Speedbird (BA), Delvag (Lufthansa).","En clair : un risque aérien est réparti entre de nombreux assureurs.\n\nAstuce : facultative = risque par risque ; traité = portefeuille."];
FR[239]=["Règl. 785/2004 — qui","Tous les transporteurs et exploitants volant dans, vers, depuis ou au-dessus de l'UE, européens ou non ; aéronefs d'État exclus. Guerre et terrorisme doivent être couverts. Applicable depuis le 30.4.2005.","","En clair : une compagnie américaine atterrissant à Paris doit aussi être assurée selon ces minima.\n\nPiège : la guerre n'est pas exclue de l'assurance obligatoire."];
FR[240]=["250 000 DTS","Assurance passagers minimale par passager (art. 6 Règl. 785/2004) — jamais relevée.","Non commercial ≤ 2 700 kg MTOM : au moins 100 000 DTS.","En clair : minimum d'assurance, pas plafond de responsabilité.\n\nAstuce : 250 000 (assurance) ≠ 151 880 (seuil MC99)."];
FR[241]=["1 288 DTS · 22 DTS/kg","Minima du Règl. 785/2004 pour les bagages et le fret — désormais inférieurs aux 1 519 DTS et 26 DTS/kg de MC99.","","En clair : l'assurance obligatoire ne couvre plus tout le risque légal depuis 2024.\n\nPourquoi : bon point de critique (« mismatches »)."];
FR[242]=["0,75 M → 700 M DTS","Minimum tiers par accident, selon la MTOM en 10 classes (art. 7). B737 : 300 M · B747/A330 : 500 M.","","En clair : plus l'avion est lourd, plus l'assurance tiers doit être élevée.\n\nAstuce : mêmes catégories que le LuftVG allemand."];
FR[243]=["Confondre 250 000 DTS et le plafond de responsabilité","250 000 = minimum d'assurance. 151 880 = seuil MC99, illimité au-delà.","","En clair : deux chiffres, deux logiques.\n\nAstuce : assurance ≠ responsabilité."];
FR[244]=["Sanctions & autres sources","Pas de couverture → retrait de licence (transporteur UE) ou refus d'atterrissage (autres). Survols : couverture tiers seulement. Art. 50 MC99 « doivent » exiger une assurance adéquate ; Rome art. 15 « peuvent » ; Règl. 1008/2008 art. 4(h), 11.","","En clair : l'obligation d'assurance vient de plusieurs textes.\n\nAstuce : MC99 = « shall », Rome = « may »."];
FR[245]=["La police","Slip + texte (standard AVN 1C ou sur mesure). Tous risques : l'assureur prouve une exclusion. Risques dénommés : l'assuré prouve le risque couvert.","","En clair : qui porte la charge de la preuve dépend du type de police.\n\nAstuce : « all risks » favorise l'assuré."];
FR[246]=["Assurance corps","« Tous risques de perte ou dommage matériel quelle qu'en soit la cause ». Non obligatoire. Exclut l'usure, la panne mécanique. Perte totale réputée ~75–80 % de la valeur. Perte totale présumée (60 jours dans AVN 1C).","Clause 50/50 : assureurs corps et guerre partagent tant que la cause est incertaine.","En clair : assure l'avion lui-même.\n\nExemple : MH370 → perte totale présumée.\n\nPiège : l'assurance corps n'est pas obligatoire."];
FR[247]=["Risques de guerre","AVN 48B exclut ~28 risques hostiles dont (f) saisie/restriction par un gouvernement. Rachetés par : LSW 555D (corps guerre), AVN 52E (responsabilité). Résiliables avec 7 jours de préavis.","","En clair : la guerre est exclue des polices standard puis rachetée à part.\n\nPourquoi : clé de l'affaire des avions russes.\n\nAstuce : 48B exclut, 555D et 52E rachètent."];
FR[248]=["Protection des loueurs","AVN 67B : loueur assuré additionnel — une violation par la compagnie ne lui est pas opposable, indemnités versées à lui, police primaire. Plus ses propres polices contingent et possessed.","","En clair : le loueur est protégé même si la compagnie triche.\n\nAstuce : contingent = si la police de la compagnie ne paie pas ; possessed = quand il a l'avion."];
FR[249]=["","Agrégation : 15 avions saisis à l'aéroport de Koweït (1990) = un seul événement, un seul plafond. Un 747 de BA non visé, détruit des mois plus tard = événement distinct.","","En clair : le nombre d'« occurrences » décide du nombre de plafonds et de franchises.\n\nAstuce : Kuwait = un ; Scott = séparé."];
FR[250]=["","Avions perdus le 10.3.2022 par privation définitive ; cause directe : Résolution gouvernementale 311 = restriction gouvernementale, un risque de guerre → les assureurs guerre paient au titre de la couverture contingent.","Appel pendant.","En clair : les loueurs occidentaux ont gagné contre les assureurs guerre.\n\nPourquoi : décision très récente et importante.\n\nAstuce : perte = privation définitive ; cause = gouvernement = guerre."];
FR[251]=["Avions russes : les détails","La couverture contingent joue directement, la possessed non. Les préavis de résiliation de 7 jours échouent : le risque tenait déjà les avions « dans son emprise ». Clause sanctions (AVN 111) et exclusion « pays d'immatriculation » rejetées.","Immatriculation = Bermudes ou Irlande (art. 18 Chicago).","En clair : chaque argument des assureurs a été écarté.\n\nAstuce : « grip of the peril » = le risque avait commencé avant la résiliation."];
FR[252]=["","Sursis refusé : les loueurs pouvaient agir contre leurs assureurs à Londres malgré les polices des exploitants soumises au droit russe.","","En clair : le contentieux reste à Londres.\n\nAstuce : leçon — ne pas choisir la loi de la zone de guerre pour une assurance guerre."];
FR[253]=["Les avions sont intacts et volent encore en Russie. Les loueurs ont-ils subi une perte ?","Oui : la privation de possession est une perte lorsque, selon la balance des probabilités, elle est définitive (récupération = « simple chance »).","","En clair : on peut perdre un avion sans qu'il soit abîmé.\n\nAstuce : piège classique — « intact » ≠ « pas de perte »."];
