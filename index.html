FR[20]=["Art. 53(7) MC99 — le moment","MC99 entre en vigueur pour un État adhérent le 60e jour après le dépôt. La question « quel régime ? » se tranche à la date du transport.","","En clair : un pays qui adhère n'est pas lié immédiatement.\n\nPourquoi : les énoncés peuvent dater les faits juste avant une adhésion.\n\nExemple : Grenade partie depuis le 7.8.2026 → un vol de juillet 2026 n'était pas encore sous MC99 pour elle."];
FR[21]=["La couche UE : Règl. 2027/97 (modifié par 889/2002)","Étend les règles de MC99 aux transporteurs communautaires, y compris les vols à l'intérieur d'un seul État membre (passagers et bagages), et ajoute une avance d'au moins 16 000 DTS en cas de décès.","","En clair : un Paris–Nice sur Air France n'est pas « international », mais le droit de l'UE y applique quand même les règles MC99.\n\nPourquoi : sans ce règlement, les vols intérieurs relèveraient du droit national.\n\nAstuce : 2027/97 = « MC99 à domicile » + avance de 16 000 DTS."];
FR[22]=["Le Règl. 261 s'ajoute, il ne remplace pas","Il s'applique en parallèle de MC99, jamais à sa place (IATA & ELFAA, C-344/04).","","En clair : un passager retardé peut cumuler l'indemnité forfaitaire 261 et des dommages-intérêts MC99 pour un préjudice prouvé.\n\nPourquoi : erreur classique : répondre « MC99 OU 261 ».\n\nAstuce : 261 = forfait pour tous ; MC99 = préjudice individuel prouvé (l'art. 12 permet de déduire l'un de l'autre)."];
FR[23]=["","Part des accidents majeurs (2016–2026) pour lesquels MC99 était le régime applicable.","La plupart des accidents sont des vols intérieurs dans des États non parties → droit national (Pakistan, RDC, Russie, droit local américain).","En clair : MC99 est très ratifiée, mais s'applique rarement aux grandes catastrophes.\n\nPourquoi : bon argument pour une dissertation sur les limites de l'uniformité.\n\nExemple : un crash intérieur au Pakistan relève du régime pakistanais à trois niveaux."];
FR[24]=["","Nombre de ratifications ou adhésions à MC99 (UE incluse) ; Varsovie en compte 152.","Les modules disent 141 et 145 — utilise « environ 145 ».","En clair : MC99 couvre presque autant d'États que Varsovie.\n\nPourquoi : utile pour nuancer — « about 145 parties, close to Warsaw's 152 ».\n\nAstuce : 145 ≈ 95 % de Varsovie."];
FR[25]=["Londres – Paris – Téhéran : quel régime ?","Varsovie modifiée à La Haye : l'Iran n'est pas partie à MC99, mais le Royaume-Uni et l'Iran sont tous deux parties à Varsovie/La Haye.","","En clair : on ignore Paris (escale), on compare Royaume-Uni et Iran.\n\nRaisonnement : MC99 ? non (Iran). Instrument commun le plus élevé ? Varsovie/La Haye.\n\nAstuce : cite Grein (un contrat) + art. 1 Varsovie."];
FR[26]=["St George's (Grenade) – Phnom Penh : quel régime ?","MC99 : la Grenade (depuis le 7.8.2026) et le Cambodge (depuis le 1.4.2025) sont tous deux parties.","","En clair : deux adhésions récentes, d'où le piège.\n\nPourquoi : sans les dates d'adhésion, on répondrait à tort « droit national ».\n\nAstuce : pense à l'art. 53(7) — entrée en vigueur 60 jours après dépôt."];
FR[27]=["Nairobi – Thimphu : quel régime ?","Droit national désigné par les règles de conflit du for : le Bhoutan n'est partie à rien.","","En clair : le Kenya est partie à MC99, mais il faut les deux États.\n\nRaisonnement : MC99 non, Varsovie non → le juge saisi applique ses règles de conflit de lois.\n\nAstuce : Bhoutan, Somalie, Haïti = parties à rien."];
FR[28]=["Melbourne – Port Moresby – Melbourne : quel régime ?","MC99 : départ et destination en Australie (partie) avec escale prévue à l'étranger — quel que soit le statut de la Papouasie-Nouvelle-Guinée.","","En clair : un aller-retour dans un seul État partie avec une escale prévue ailleurs est international.\n\nPourquoi : piège classique — on pense qu'il faut que la PNG soit partie.\n\nAstuce : art. 1(2) « even if that State is not a State Party »."];
FR[29]=["Varsovie/La Haye mais PAS MC99","Iran, Irak, Papouasie-Nouvelle-Guinée, Afghanistan, Libye, Laos, Corée du Nord, Yémen, Algérie, Venezuela, Biélorussie, Ouzbékistan, Guinée.","Varsovie seul (sans La Haye) : Myanmar. Rien du tout : Bhoutan, Somalie, Haïti.","En clair : ce sont les pays qui font basculer un cas vers Varsovie ou le droit national.\n\nPourquoi : aucune liste ne sera fournie à l'examen (« simple countries »).\n\nAstuce : moyen mnémo — « Iran, Irak, Afghanistan, Libye, Yémen » (zones de conflit) + Venezuela, Biélorussie."];
FR[30]=["Parties à MC99 dont tu pourrais douter","Thaïlande (depuis 2017, jamais partie à Varsovie), Russie (depuis le 21.8.2017), Cambodge (1.4.2025), Grenade (7.8.2026), Chine y compris Hong Kong, Inde, Türkiye, Ukraine.","Seulement signataires : Bahamas, République centrafricaine, Zambie.","En clair : ces États SONT parties à MC99.\n\nPourquoi : on pourrait croire la Russie ou la Thaïlande hors système.\n\nAstuce : signer ≠ ratifier — Bahamas, RCA, Zambie ne sont pas liés."];
FR[31]=["Quel État est partie à Varsovie 1929 seulement, sans La Haye ?","Le Myanmar.","","En clair : c'est le cas « Chubb » encore possible aujourd'hui.\n\nExemple : Myanmar–Iran (La Haye) → pas d'instrument commun → droit national."];
FR[32]=["Champ de MC99 (art. 1(1))","Transport de personnes, bagages ou marchandises par aéronef contre rémunération, ou transport gratuit par une entreprise de transport aérien. Un contrat est nécessaire.","Équipage, passagers clandestins et transport gratuit par un particulier sont exclus.","En clair : pas de contrat de transport = pas de MC99.\n\nPourquoi : un membre d'équipage blessé relève du droit du travail, pas de MC99.\n\nExemple : un ami qui t'emmène gratuitement dans son avion privé → hors MC99."];
FR[33]=["Le champ d'abord","MC99 est exclusive : hors de son champ, Varsovie ou droit national ; dans son champ sans recours, aucune action.","Ne jamais commencer par l'art. 17 avant d'avoir vérifié l'art. 1.","En clair : le champ décide de tout, y compris de l'absence totale de recours.\n\nPourquoi : à cause de l'art. 29, un passager « dans » MC99 sans dommage couvert n'a rien du tout.\n\nExemple : Tseng — fouille humiliante, pas de lésion → zéro."];
FR[34]=["Cas particuliers du champ MC99","« Aéronef » est défini par le droit national. Animaux = bagages ou fret ; dépouilles = fret. Transport par l'État couvert (art. 2(1)), réserve possible de l'art. 57 pour le transport militaire.","","En clair : quelques catégories qu'on ne range pas intuitivement.\n\nPourquoi : utile si l'énoncé parle d'un chien, d'un cercueil ou d'un vol gouvernemental.\n\nLien : Iberia (C-218/24) — l'animal n'est pas un passager."];
FR[35]=["Varsovie 1929 : le marché","Règles uniformes et faute présumée pour les passagers, en échange d'une responsabilité limitée et assurable pour une industrie fragile. Plafond : 125 000 francs-or par passager, 250 francs/kg.","Rédigé par le CITEJA, en français.","En clair : en 1929, on protège une aviation naissante en plafonnant sa responsabilité.\n\nPourquoi : toute l'histoire ultérieure consiste à relever ces plafonds.\n\nAstuce : Varsovie = faute présumée + plafond bas ; MC99 = responsabilité objective + plafond élevé."];
FR[36]=["250 000 francs","Plafond passager après le Protocole de La Haye 1955 (double de Varsovie). Les États-Unis n'ont ratifié La Haye qu'en 2003.","","En clair : La Haye double le plafond de 1929.\n\nPourquoi : la ratification tardive des États-Unis explique l'affaire Chubb v. Asiana.\n\nAstuce : 125 000 → 250 000."];
FR[37]=["La route vers MC99","Guadalajara 1961 (transporteur de fait) · Guatemala 1971 (jamais en vigueur) · Protocoles additionnels de Montréal 1975 (DTS ; PAM 4 : 17 DTS/kg) · Accord de Montréal 1966 (75 000 USD) · Accord IATA 1995 (objectif jusqu'à 100 000 DTS).","","En clair : les États ont avancé par petits protocoles, l'industrie par accords privés, jusqu'au texte unique de 1999.\n\nPourquoi : question d'histoire possible en dissertation.\n\nAstuce : 1966 = 75 000 USD (vols US) ; 1995 = 100 000 DTS objectif → modèle de MC99."];
FR[38]=["28 mai 1999 → 4 nov. 2003","MC99 adoptée à Montréal, puis entrée en vigueur. Convention autonome, pas un protocole.","","En clair : MC99 n'amende pas Varsovie, c'est un nouveau traité.\n\nPourquoi : d'où l'art. 55 qui règle la coexistence.\n\nAstuce : signée en 1999, en vigueur en 2003."];
FR[39]=["Transporteur contractuel v. transporteur de fait (art. 39)","Contractuel : conclut le contrat, répond de tout le transport. De fait : exécute tout ou partie en vertu d'une autorisation (partage de code, wet lease), répond de sa partie. Action contre l'un, l'autre ou les deux (art. 40, 45).","","En clair : tu achètes chez A, tu voles sur un avion de B → A et B sont responsables.\n\nPourquoi : sujet type (Ms Kramer : Maple Air / Russia Air).\n\nAttention : sous le Règl. 261, seul le transporteur effectif (operating carrier) paie."];
FR[40]=["Le chapitre V en une carte","Art. 41 actes imputés réciproquement · art. 44 total ≤ montant le plus élevé · art. 46 for supplémentaire au domicile/siège du transporteur de fait · art. 47 clauses limitatives nulles · art. 48 recours hors MC99.","","En clair : les deux transporteurs forment un bloc face au passager, et règlent leurs comptes entre eux selon leur contrat.\n\nPourquoi : l'art. 46 donne un for de plus — à mentionner à l'étape 4.\n\nAstuce : 41 imputation, 44 pas de double indemnisation, 45 choix, 46 for, 48 recours."];
FR[41]=["Transport successif (art. 1(3), 36)","Un seul transport si considéré comme une seule opération. Passagers : seulement le transporteur du tronçon de l'accident (sauf si le premier a pris en charge tout le voyage). Fret et bagages : premier, dernier et transporteur du tronçon, solidairement.","","En clair : plusieurs compagnies se succèdent sur un même billet.\n\nPourquoi : à ne pas confondre avec transporteur de fait (une compagnie qui vole pour une autre).\n\nAstuce : passagers = « le tronçon » ; marchandises = « premier, dernier, tronçon »."];
FR[42]=["Ms Kramer a acheté son billet chez Maple Air ; le vol était opéré par Russia Air. Qui peut-elle attaquer sous MC99 ?","L'un ou les deux : Maple Air comme transporteur contractuel (tout le transport), Russia Air comme transporteur de fait (sa partie) — art. 39, 40, 45.","Sous le Règl. 261, ce serait seulement le transporteur effectif.","En clair : c'est le sujet d'examen type (35 %).\n\nRaisonnement : chapitre V MC99 → définitions art. 39 → responsabilité art. 40 → choix du défendeur art. 45 → for supplémentaire art. 46.\n\nAstuce : distingue toujours la logique MC99 (contractuel + de fait) et 261 (operating carrier)."];
FR[43]=["Art. 17(1) : les quatre conditions","(1) un accident, (2) un lien de causalité, (3) un décès ou une lésion corporelle, (4) à bord ou pendant l'embarquement/le débarquement. « Upon condition only » = pas de faute à prouver.","À tester une par une dans chaque réponse.","En clair : le passager n'a pas à prouver une faute, seulement ces quatre éléments.\n\nPourquoi : c'est le cœur du sujet type ; l'examinateur attend les quatre, chacune avec un arrêt.\n\nAstuce : « A-C-L-B » : Accident, Causalité, Lésion, Bord."];
FR[44]=["","Accident = événement inattendu ou inhabituel extérieur au passager, et non la réaction du passager au fonctionnement normal de l'avion.","La surdité de Mme Saks après une pressurisation normale : pas d'accident.","En clair : si tout s'est passé normalement et que c'est ton corps qui réagit, ce n'est pas un accident.\n\nPourquoi : définition mondiale de référence, suivie par la plupart des juridictions.\n\nAstuce : en forum UE, ajoute toujours Niki (définition plus large)."];
FR[45]=["","UE : accident = événement imprévu, dommageable et involontaire. Couvre tout objet servant au service des passagers qui blesse — sans risque typique de l'aviation.","L'affaire du café brûlant.","En clair : un gobelet de café renversé sur un enfant est un accident, même si cela n'a rien à voir avec le vol.\n\nPourquoi : la CJUE n'a pas repris Saks ; l'élément « extérieur » disparaît presque.\n\nAstuce : Niki = café ; Austrian = escalier."];
FR[46]=["","Un atterrissage dur dans la plage normale d'exploitation n'est pas un accident : « imprévu » s'apprécie selon les standards du secteur, pas selon le ressenti du passager.","","En clair : un atterrissage brutal mais techniquement normal → pas d'accident.\n\nPourquoi : limite à la définition large de Niki.\n\nAstuce : « imprévu » = imprévu pour un professionnel de l'aviation."];
FR[47]=["","Une chute dans l'escalier de débarquement sans cause identifiable est quand même un accident ; la seule défense du transporteur est l'art. 20 (elle ne tenait pas la rampe).","","En clair : même sans savoir pourquoi elle est tombée, c'est un accident ; sa propre négligence réduit seulement l'indemnisation.\n\nPourquoi : montre que l'UE déplace le débat de « accident ? » vers « faute de la victime ? ».\n\nAttention : ce n'est PAS l'affaire du café (c'est Niki)."];
FR[48]=["« Austrian Airlines = le gobelet de café qui tombe »","Non — c'est Niki (C-532/18). Austrian Airlines, c'est la chute dans l'escalier. Le module 2 les a confondus.","","En clair : une erreur dans tes supports de cours, corrigée dans le Companion.\n\nAstuce : « Niki → café ; Austrian → escalier (et rampe) »."];
FR[49]=["","L'événement doit être lié à l'exploitation de l'aéronef : une glissade sur une bande plastique du plancher n'était pas un accident.","","En clair : l'Angleterre ajoute une condition : lien avec le fonctionnement de l'avion.\n\nPourquoi : contraste avec Niki (UE), qui ne l'exige pas.\n\nAstuce : en forum anglais, cite Barclay ; en forum UE, Niki."];
FR[50]=["","L'omission de l'équipage peut être l'événement : refuser de déplacer un passager asthmatique loin de la zone fumeurs, qui meurt = accident.","Contraste : Labbadia v. Alitalia (Angl. 2019) : l'inaction n'est pas un événement — gagné en requalifiant en actes positifs (escalier sans auvent sous la neige).","En clair : aux États-Unis, ne rien faire peut être un « événement inhabituel ».\n\nPourquoi : sert dès qu'un énoncé décrit un équipage passif.\n\nAstuce : US = omission OK (Husain) ; Angleterre = requalifier en acte (Labbadia)."];
FR[51]=["","Un état de santé préexistant n'est pas un accident : passagère âgée qui tombe près du tapis à bagages ; crise cardiaque un jour après un détournement.","Causalité = question de fait : l'accident doit être la cause directe.","En clair : si c'est ta santé qui lâche, ce n'est pas la faute de l'aviation.\n\nPourquoi : condition « causalité » des quatre conditions de l'art. 17.\n\nContraste : Husain, où c'est l'équipage qui crée l'événement."];
FR[52]=["Accident ou pas ?","Terrorisme et détournement : oui (Day v. TWA, Husserl v. Swissair). Disposition normale des sièges : non (Potter v. Delta). Thrombose veineuse profonde : non (DVT Group Litigation [2005] UKHL 72).","","En clair : quelques catégories tranchées.\n\nPourquoi : réponses réflexes en cas pratique.\n\nAstuce : la thrombose (DVT) vient de l'immobilité normale en vol → réaction interne, pas d'accident."];
FR[53]=["","L'embarquement s'apprécie fonctionnellement : activité, contrôle du transporteur, lieu, imminence. Les passagers en file pour la fouille à la porte embarquaient.","Ce que fait le passager compte plus que l'endroit (aussi McCarthy v. Northwest).","En clair : à la porte d'embarquement, sous contrôle de la compagnie, juste avant le vol → c'est l'embarquement.\n\nPourquoi : 4e condition de l'art. 17.\n\nContre-exemple : dans le hall général ou au tapis à bagages → non."];
FR[54]=["Passager blessé dans le hall général du terminal","Ni embarquement ni débarquement. Mais une action peut exister en droit national contre l'aéroport (ex. sa moquette).","","En clair : MC99 ne joue pas, mais la victime n'est pas sans recours.\n\nPourquoi : l'étape 5 (« autres actions ») rapporte des points.\n\nAstuce : penser aéroport, gestionnaire, assureur."];
FR[55]=["","Le préjudice purement psychique n'est pas une « lésion corporelle » (comparaison avec « lésion corporelle » du texte français) : pas d'indemnisation sous l'art. 17.","","En clair : aux États-Unis, l'angoisse seule ne donne rien.\n\nPourquoi : arrêt clé du débat sur le préjudice psychique.\n\nAstuce : Floyd (US) + Morris (UK) = non ; Laudamotion (UE) = oui sous conditions."];
FR[56]=["","Angleterre : préjudice psychique pur indemnisable seulement s'il exprime une lésion physique du cerveau.","","En clair : il faut une atteinte physique au cerveau, pas juste un traumatisme psychologique.\n\nPourquoi : position anglaise, proche de Floyd.\n\nAstuce : cite-le avec Floyd côté « non »."];
FR[57]=["","Divergence américaine sur le préjudice psychique accompagnant une lésion : Ehrlich — seulement s'il est causé par la lésion ; Doe — s'il accompagne une lésion causée par l'accident.","Doe : aiguille dans la pochette du siège, doigt piqué, peur du VIH.","En clair : dans Doe, la piqûre est minime mais la peur du VIH est indemnisée car elle accompagne une lésion physique.\n\nPourquoi : utile quand l'énoncé contient une petite blessure + un gros choc psychique.\n\nAstuce : Ehrlich = « causé par » ; Doe = « accompagne »."];
FR[58]=["","UE : le préjudice psychique pur (SSPT) est indemnisable s'il est médicalement établi et assez grave pour affecter la santé générale et nécessiter un traitement.","Moteur qui explose au décollage, évacuation, personne blessé physiquement.","En clair : en UE, un stress post-traumatique diagnostiqué suffit.\n\nPourquoi : c'est l'opposé de Floyd ; le passager a intérêt à agir devant un juge de l'UE.\n\nAstuce : conditions = diagnostic médical + gravité + traitement."];
FR[59]=["SSPT diagnostiqué après une évacuation, aucune blessure physique. Action sous l'art. 17 ?","Dépend du for : États-Unis non (Floyd), Angleterre non (Morris), UE oui si médicalement établi et grave (Laudamotion) → le passager cherchera un for européen.","","En clair : même texte, résultat différent selon le juge.\n\nRaisonnement : condition « lésion corporelle » → divergence → choix du for (art. 33) → exclusivité (pas de repli sur le droit national).\n\nAstuce : termine par le forum shopping, ça montre la vision d'ensemble."];
FR[60]=["Pourquoi le préjudice psychique compte autant","Exclusivité (art. 29) : si MC99 ne donne rien, pas de repli sur la responsabilité délictuelle nationale. D'où des lectures larges de l'art. 17 par certains juges.","Laudamotion est défendable : la Conférence de 1999 ne voulait pas figer la jurisprudence.","En clair : « pas de lésion corporelle » = « aucune indemnisation du tout ».\n\nPourquoi : relie deux fiches (art. 17 et exclusivité) — très apprécié en dissertation.\n\nAstuce : avocats des compagnies = « dévoiement » ; avocats des passagers = « compréhension moderne de la santé mentale »."];
FR[61]=["Décès et passagers disparus","Le décès est défini par le droit national ; les disparus posent des délais de présomption (MH370). MC99 prévoit aussi des avances (art. 28).","","En clair : MC99 ne dit pas quand une personne est « morte ».\n\nExemple : MH370 — délai malaisien très long, mais les autorités ont admis le décès et l'indemnisation a été rapide.\n\nLien : avance UE ≥ 16 000 DTS (Règl. 2027/97)."];
FR[62]=["M. Smith (KLM) renverse son propre café et se brûle. Résultat ?","Accident défendable (Niki : objet servant au service des passagers), mais faute de la victime art. 20 — Medina v. American Airlines (2006) : sa propre négligence était la seule cause directe.","","En clair : c'est le cas de la séance de préparation.\n\nRaisonnement : accident ? oui en UE (Niki) → exonération totale ou partielle (art. 20) → Medina.\n\nAstuce : l'art. 20 joue même dans le premier palier objectif."];
FR[63]=["Après un grand crash : qui d'autre ?","Constructeurs, organismes de maintenance, prestataires de navigation aérienne, loueurs, aéroports, États — MC99 ne les protège pas.","Les familles veulent des réponses, des responsables, de la prévention, une indemnisation.","En clair : MC99 ne couvre que le transporteur.\n\nPourquoi : les familles attaquent le constructeur pour échapper aux plafonds et à l'exclusivité.\n\nLien : Paris Air Crash 1974, Boeing 737 MAX."];
FR[64]=["151 880 DTS","MC99 · décès/lésion · premier palier objectif par passager, en vigueur depuis le 28.12.2024.","Texte de 1999 : 100 000 — ce que ta copie peut afficher.","En clair : jusqu'à ce montant, le transporteur paie sans pouvoir prouver son absence de faute.\n\nPourquoi : chiffre n° 1 de l'examen.\n\nAttention : ce n'est PAS un plafond — au-delà, c'est illimité sauf preuve de l'art. 21(2)."];
FR[65]=["6 303 DTS","MC99 · plafond par passager pour le retard (depuis le 28.12.2024).","Texte de 1999 : 4 150.","En clair : le maximum pour un préjudice de retard prouvé (hôtel, rendez-vous manqué…).\n\nPourquoi : il faut quand même prouver le dommage ; ce n'est pas un forfait.\n\nAstuce : franchissable en cas de dol ou de témérité (art. 22(5))."];
FR[66]=["1 519 DTS","MC99 · plafond par passager pour les bagages (depuis le 28.12.2024), préjudice moral inclus.","Texte de 1999 : 1 000.","En clair : bagage perdu = au maximum 1 519 DTS, tout compris.\n\nExemple : chien perdu (Iberia) → plafonné ici, même pour la peine du propriétaire.\n\nAstuce : seule une déclaration spéciale d'intérêt l'augmente."];
FR[67]=["26 DTS/kg","MC99 · plafond fret (depuis le 28.12.2024) — infranchissable.","Texte de 1999 : 17.","En clair : même un vol délibéré ne fait pas sauter le plafond fret.\n\nPourquoi : contraste avec CMR (8,33 DTS/kg mais franchissable).\n\nExemple : Brink's v. Air Canada — or volé, plafond appliqué."];
FR[68]=["Citer les plafonds de 1999 de la copie fournie","Dire qu'ils ont été révisés par l'art. 24 et donner 151 880 / 6 303 / 1 519 / 26 DTS.","","En clair : la copie officielle peut montrer les vieux chiffres.\n\nPourquoi : montrer que tu connais la révision de 2024 = points faciles.\n\nAstuce : « The 1999 text shows 100,000 SDR, revised under Art. 24 to 151,880 SDR since 28 December 2024 »."];
FR[69]=["Art. 24 : révision des plafonds","L'OACI révise tous les 5 ans selon l'inflation. Pas de ratification : acceptation tacite sauf si une majorité d'États s'y oppose.","2009 : 113 100 / 4 694 / 1 131 / 19 · 2019 : 128 821 / 5 346 / 1 288 / 22.","En clair : les plafonds montent automatiquement.\n\nPourquoi : explique pourquoi les chiffres de ta copie et de ton cours diffèrent.\n\nAstuce : 2009 → 2019 → 2024 (le dernier en date)."];
FR[70]=["Les deux paliers (art. 21)","Jusqu'à 151 880 DTS : objectif, seule défense la faute de la victime. Au-delà : illimité, sauf si le transporteur prouve l'absence de sa propre négligence ou la faute exclusive d'un tiers (art. 21(2)).","La charge pèse sur le transporteur, et elle est lourde.","En clair : en dessous, il paie toujours ; au-dessus, il paie sauf s'il prouve qu'il n'a rien à se reprocher.\n\nExemple : PS752 — la compagnie n'a pas réussi cette preuve.\n\nAstuce : « strict puis présumé » — jamais « plafonné »."];
FR[71]=["« 151 880 DTS plafonne les dommages »","C'est un seuil, pas un plafond : au-delà, la responsabilité est illimitée sauf preuve de l'art. 21(2).","","En clair : erreur la plus coûteuse en copie.\n\nAstuce : écris « threshold » et jamais « cap » pour 151 880."];
FR[72]=["","PS752, abattu après le décollage de Téhéran (8.1.2020) : la compagnie échoue sur l'art. 21(2) — pas d'évaluation des risques selon le Doc OACI 10084, NOTAM et alertes ignorés.","Que d'autres compagnies volent sur la route n'était pas une défense.","En clair : survoler une zone de conflit sans analyse de risque = négligence.\n\nPourquoi : montre combien la preuve de l'art. 21(2) est difficile.\n\nLien : MH17 pose la même question pour Malaysia Airlines."];
FR[73]=["Franchir les plafonds (art. 22(5))","Les plafonds retard et bagages tombent en cas de dol, ou de témérité avec conscience qu'un dommage en résulterait probablement, du transporteur ou de ses préposés dans l'exercice de leurs fonctions.","Fret : jamais.","En clair : faute très grave = plus de plafond (sauf fret).\n\nExemple : un bagagiste qui vole dans une valise dans le cadre de son travail.\n\nAstuce : retard + bagages franchissables ; fret infranchissable."];
FR[74]=["Déclaration spéciale d'intérêt","Faite à la remise (avec un supplément si demandé), elle relève les plafonds bagages et fret (art. 22(2)–(3)).","Seul moyen de relever le plafond fret.","En clair : tu déclares la valeur à l'avance, tu paies un peu plus, tu es mieux couvert.\n\nPiège : une valeur en douane n'est pas une déclaration spéciale (Brink's).\n\nLien : le Règl. 2026/2202 la rendra gratuite pour fauteuils roulants et chiens d'assistance."];
FR[75]=["Art. 25–27 : aménager par contrat","Art. 25 le transporteur peut relever ou supprimer les plafonds · art. 26 plafonds inférieurs nuls (le contrat survit) · art. 27 ajouter de la protection, jamais en retirer.","","En clair : liberté contractuelle à sens unique, en faveur du passager.\n\nExemple : clause « pas de responsabilité pour la chaîne du froid au sol » → nulle (Wealmoor).\n\nAstuce : « on peut ajouter, pas retirer »."];
FR[76]=["Art. 20 : faute de la victime","Exonère totalement ou partiellement sous tous les chefs de responsabilité — même le premier palier objectif de l'art. 21(1).","","En clair : si le passager a contribué à son dommage, l'indemnité baisse ou disparaît.\n\nExemples : Medina (café renversé par lui-même), Austrian Airlines (ne tenait pas la rampe).\n\nAstuce : c'est la seule défense dans le premier palier."];
FR[77]=["","MC99 dit quand et jusqu'à combien, pas quels dommages : ce qui est juridiquement indemnisable dépend du droit national applicable.","Silverman v. Ryanair (Angl. 2021) : renvoi aux règles de Rome I/II, pas automatiquement la loi du for.","En clair : MC99 ouvre la porte, le droit national fixe le montant et les postes.\n\nPourquoi : explique les écarts énormes d'indemnisation.\n\nAstuce : choisir un tribunal américain ne garantit pas la loi américaine."];
FR[78]=["20 M USD v. ≈ 450 000","Valeur du même décès devant un juge américain v. dans un « nouvel » État membre de l'UE.","C'est la loi applicable qui fixe la valeur d'une demande.","En clair : un ordre de grandeur pour illustrer le forum shopping.\n\nPourquoi : à glisser dans une réponse sur la compétence ou Zicherman."];
FR[79]=["Préposés et mandataires (art. 30)","Les agents d'escale (Swissport, Menzies, dnata) bénéficient des plafonds seulement s'ils ont agi dans l'exercice de leurs fonctions. Le total ne peut dépasser les plafonds.","Les plafonds fret restent infranchissables même pour eux.","En clair : l'agent d'escale est protégé comme la compagnie, s'il travaillait pour elle.\n\nPourquoi : utile quand le dommage vient du sol (rampe, manutention).\n\nAstuce : un agent d'escale n'est pas un « tiers » au sens de Rome 1952."];
FR[80]=["1 DTS ≈ 1,35 USD","Unité de compte du FMI (1969), panier de cinq devises. ≈ 1,21 EUR (octobre 2026).","","En clair : pour convertir mentalement, 151 880 DTS ≈ 184 000 €.\n\nPourquoi : montre que tu sais ce que vaut un plafond."];
FR[81]=["250 € · 400 € · 600 €","Indemnisation art. 7 Règl. 261 : ≤ 1 500 km · intra-UE > 1 500 km et autres 1 500–3 500 km · autres.","Inchangé par la révision de 2026.","En clair : un forfait selon la distance, sans prouver de préjudice.\n\nExemple : Paris–New York → 600 € ; Paris–Lisbonne (≈1 450 km) → 250 €.\n\nAstuce : distance orthodromique du 1er départ à la destination finale (Bossen)."];
FR[82]=["7 · 14 · 21 jours","Réclamation écrite art. 31 MC99 : avarie de bagage enregistré · avarie de fret · retard.","Varsovie 1929 : 3 / 7 / 14 jours.","En clair : passé ces délais, plus aucune action (sauf fraude du transporteur).\n\nAttention : la perte n'est pas une avarie — pas de délai de 7 jours pour un bagage perdu.\n\nAstuce : bagage 7, fret 14, retard 21."];
FR[83]=["21 jours","Bagage enregistré non arrivé après ce délai → réputé perdu (art. 17(3)).","La perte n'est pas une « avarie » : pas de réclamation de 7 jours.","En clair : au bout de 21 jours, tu peux agir comme pour une perte.\n\nAstuce : ne confonds pas avec les 21 jours de réclamation pour retard (art. 31)."];
FR[84]=["2 ans","Délai MC99 (art. 35), extinctif. Varsovie : 2 ans (art. 29). Rome 1952 : 2 ans, max 3.","Règl. 261 : droit national (Cuadrench Moré).","En clair : après 2 ans, le droit disparaît — pas de suspension possible.\n\nPiège : ne jamais appliquer ces 2 ans à une demande 261.\n\nAstuce : 261 = de 1 à 10 ans selon le pays."];
FR[85]=["16 000 DTS","Avance minimale par passager en cas de décès (Règl. 2027/97 modifié).","","En clair : l'UE oblige ses compagnies à verser vite une avance aux familles.\n\nPourquoi : MC99 (art. 28) renvoie au droit national ; l'UE fixe un chiffre."];
FR[86]=["Quel est le plafond bagages MC99 aujourd'hui ?","1 519 DTS par passager (depuis le 28.12.2024), préjudice moral inclus (Vueling), sauf déclaration spéciale.","","En clair : 1 519 DTS, tout compris.\n\nAstuce : franchissable par dol/témérité (art. 22(5)) ou relevé par déclaration spéciale."];
FR[87]=["Une faute intentionnelle fait-elle tomber le plafond fret ?","Non. 26 DTS/kg est infranchissable ; seule une déclaration spéciale d'intérêt le relève (art. 22(3)).","","En clair : le fret est le seul plafond « en béton ».\n\nPourquoi : héritage du Protocole de Montréal n° 4 — prévisibilité pour assureurs et transporteurs.\n\nContraste : CMR 8,33 DTS/kg, franchissable."];
FR[88]=["100 000 DTS","Plafond de responsabilité objective des accords IATA de 1995 (> 90 % du secteur) — le pont vers MC99.","","En clair : l'industrie avait déjà adopté le système à deux paliers par contrat avant 1999.\n\nPourquoi : MC99 a repris ce chiffre dans son texte de 1999."];
FR[89]=["Bagages enregistrés (art. 17(2))","Responsabilité objective si l'événement a eu lieu à bord ou pendant que le bagage était sous la garde du transporteur. Défense : défaut, qualité ou vice propre du bagage.","","En clair : valise enregistrée abîmée → la compagnie paie sans faute à prouver.\n\nDéfense : la valise était déjà défectueuse.\n\nAstuce : réclamation écrite sous 7 jours (art. 31)."];
FR[90]=["Bagages non enregistrés","Transporteur responsable seulement en cas de faute de sa part ou de ses préposés.","Les animaux en cabine relèvent de ce régime.","En clair : ton sac cabine, c'est à toi de le surveiller ; il faut prouver une faute.\n\nExemple : un steward fait tomber ton ordinateur → faute → responsabilité."];
FR[91]=["","Le plafond bagages inclut le préjudice moral (non matériel).","","En clair : pas de supplément pour la contrariété au-dessus de 1 519 DTS.\n\nPourquoi : base de l'arrêt Iberia (chien perdu).\n\nAstuce : « moral inclus dans le plafond »."];
FR[92]=["","Un enregistrement électronique d'une déclaration orale à l'aéroport vaut réclamation écrite au sens de l'art. 31.","","En clair : le PIR (déclaration au comptoir bagages) suffit.\n\nPourquoi : protège le passager contre l'argument « pas de lettre écrite »."];
FR[93]=["Art. 31(4) : pas de réclamation, pas d'action","Sans réclamation écrite dans les délais, aucune action contre le transporteur — sauf fraude de sa part. Réception sans protestation = présomption de bon état.","","En clair : un délai court et couperet.\n\nPourquoi : à vérifier systématiquement à l'étape 4.\n\nAstuce : 7 (bagage) / 14 (fret) / 21 (retard)."];
FR[94]=["Retard (art. 19)","Transporteur responsable du dommage dû au retard, sauf s'il prouve que toutes les mesures raisonnables ont été prises, ou qu'il était impossible de les prendre. Le passager prouve le dommage et le lien de causalité.","Plafond 6 303 DTS, franchissable par dol ou témérité.","En clair : un vrai préjudice individuel (nuit d'hôtel, réunion manquée), pas un forfait.\n\nDéfense propre au retard : « mesures raisonnables » — elle n'existe pas pour le fret perdu.\n\nLien : cumul avec le Règl. 261."];
FR[95]=["Utiliser l'art. 19 pour un vol annulé","MC99 ne couvre ni l'annulation ni l'inexécution → droit national des contrats et Règl. 261.","","En clair : annulation ≠ retard au sens de MC99.\n\nPourquoi : erreur fréquente.\n\nAstuce : MC99 = décès/lésion, retard, bagages, fret. Rien d'autre."];
FR[96]=["Retard MC99 + Règl. 261 : cumul","261 = forfait immédiat sans preuve de préjudice. MC99 = dommage individuel prouvé (IATA & ELFAA). L'art. 12 du Règl. 261 permet au juge de déduire l'un de l'autre.","","En clair : deux étages qui se superposent.\n\nExemple : 600 € (261) + frais d'hôtel et rendez-vous manqué prouvés (MC99), moins éventuellement les 600 €.\n\nAstuce : pas de conflit avec l'art. 29 (IATA & ELFAA)."];
FR[97]=["","Un chien perdu de la soute (Buenos Aires–Madrid–Barcelone) est un bagage enregistré, pas un passager : la demande de 5 000 € de préjudice moral est plafonnée au plafond bagages.","Seule une déclaration spéciale le relève.","En clair : juridiquement, ton animal en soute = un bagage.\n\nPourquoi : arrêt récent (2025), donc probable à l'examen.\n\nRaisonnement de la CJUE : sens ordinaire, contexte, travaux préparatoires, « équilibre équitable » ; l'art. 13 TFUE (bien-être animal) est respecté."];
FR[98]=["Animaux : trois régimes","Cabine = bagage non enregistré (faute) · soute = bagage enregistré (objectif, 1 519 DTS) · sous LTA = fret (26 DTS/kg).","Les règles IATA sur les animaux vivants sont du soft law : bien-être, pas responsabilité.","En clair : le régime dépend d'où et comment voyage l'animal.\n\nAstuce : cabine → faute ; soute → objectif ; LTA → fret."];
FR[99]=["Aides à la mobilité","Bagages, plafonnés à 1 519 DTS sans déclaration spéciale — un fauteuil électrique peut coûter bien plus. Règl. 2026/2202 (considérant 40) : déclaration spéciale gratuite, coût de remplacement intégral.","","En clair : aujourd'hui, un fauteuil roulant détruit est mal indemnisé.\n\nPourquoi : sujet PRM + bagages à la fois.\n\nAttention : le nouveau règlement ne s'applique qu'à partir du 23.10.2027."];
FR[100]=["Réclamer un préjudice moral en plus du plafond bagages","Il est inclus dans le plafond (Vueling ; Iberia).","","En clair : pas de « bonus » émotionnel.\n\nAstuce : seule la déclaration spéciale augmente le montant."];
FR[101]=["Art. 29 MC99 — exclusivité","Toute action en dommages-intérêts, quel qu'en soit le fondement — « contractuel, délictuel ou autre » — ne peut être exercée que dans les conditions et limites de la Convention. Jamais de dommages punitifs.","Équivalent Varsovie : art. 24. La formule vient de Guatemala.","En clair : contre la compagnie, on ne peut pas contourner MC99 par le droit national.\n\nConséquence : dans le champ de MC99 sans recours MC99 = aucun recours.\n\nAstuce : exclusivité protège le transporteur, pas le constructeur."];
FR[102]=["","Fouille de sécurité intrusive, pas de lésion, pas d'accident → aucune action, même pas en droit de l'État de New York.","","En clair : l'humiliation sans lésion corporelle ne donne rien contre le transporteur.\n\nPourquoi : arrêt de référence de l'exclusivité.\n\nAstuce : Tseng + Sidhu + Stott = le trio de l'exclusivité."];
FR[103]=["","Otages du BA149 au Koweït : Varsovie s'appliquait et était exclusive — pas de repli sur le droit anglais, les passagers n'ont rien obtenu.","","En clair : l'exclusivité peut mener à zéro indemnisation.\n\nLien : la Cour de cassation française a jugé l'inverse pour les mêmes faits (fragmentation)."];
FR[104]=["","Un passager en fauteuil roulant non placé à côté de sa femme, humilié : pas d'action sous la réglementation britannique PRM, car le litige entrait dans le champ matériel de MC99.","« Cela semble injuste… » — la modification est laissée aux États parties.","En clair : même un règlement protecteur des PRM ne permet pas de contourner MC99.\n\nPourquoi : sert à la fois pour l'exclusivité et la fiche PRM.\n\nRemède : sanctions publiques (CAA, DOT), pas des dommages-intérêts."];
FR[105]=["","Dommages-intérêts pour absence de services en français sur des vols internationaux : exclus par l'exclusivité.","","En clair : un droit linguistique canadien ne fait pas exception à MC99.\n\nAstuce : exemple canadien de l'exclusivité."];
FR[106]=["Les exceptions à l'exclusivité","France (Duffy v. Brit Air, 1986) et Liban (UTA 141, 2010 : poursuites pénales maintenues contre les exploitants après le crash de Cotonou).","","En clair : quelques juridictions ont résisté.\n\nPourquoi : à mentionner pour nuancer en dissertation."];
FR[107]=["","L'exclusivité protège le transporteur, pas le constructeur.","Contraste : Hennessey v. Aer Lingus (Irlande, 2012).","En clair : les familles peuvent attaquer Boeing ou Airbus hors MC99, sans plafond.\n\nPourquoi : explique les grands procès contre les constructeurs (737 MAX).\n\nAstuce : étape 5 → « other defendants »."];
FR[108]=["","Le Règl. 261 est valide : sa réparation standardisée et immédiate n'est pas des « dommages » au sens de l'art. 29 — elle se situe en amont des dommages individuels de MC99.","Canada : l'IATA a encore perdu (2024 SCC 30).","En clair : 261 et MC99 coexistent sans conflit.\n\nPourquoi : réponse à « 261 est-il compatible avec MC99 ? ».\n\nCritique : la CJUE n'a pas discuté l'art. 29 dans Sturgeon."];
FR[109]=["« Le passager peut agir en responsabilité délictuelle à la place »","Pas contre le transporteur dans le champ de la Convention : pas de recours MC99 = aucun recours.","","En clair : changer d'étiquette juridique ne contourne pas l'art. 29.\n\nAstuce : « however founded » = quel que soit le fondement."];
FR[110]=["Art. 33(1) : les quatre fors","Dans un État partie, au choix du demandeur : domicile du transporteur · siège principal · établissement par lequel le contrat a été conclu · destination.","Jamais le lieu de départ en tant que tel.","En clair : le passager choisit parmi quatre tribunaux.\n\nPiège : le lieu de départ n'est pas un for (sauf s'il coïncide avec un des quatre).\n\nAstuce : « D-S-E-D » : Domicile, Siège, Établissement, Destination."];
FR[111]=["La cinquième juridiction (art. 33(2))","Décès ou lésion seulement : résidence principale et permanente du passager, si le transporteur y exploite des services et y a des locaux (à lui ou d'un partenaire).","Ajoutée à la demande des États-Unis.","En clair : un Américain blessé peut agir chez lui, sous conditions.\n\nLimite pratique : les tribunaux américains l'ont presque neutralisée (Burton, forum non conveniens).\n\nAstuce : jamais pour bagages, fret ou retard."];
FR[112]=["Cinquième juridiction pour bagages, fret ou retard","Non — décès ou lésion corporelle seulement. Fret : uniquement les quatre fors classiques.","","En clair : piège classique.\n\nAstuce : 5e for = « 5e pour les corps »."];
FR[113]=["","« Établissement par lequel le contrat a été conclu » = là où le billet ou la LTA a été émis.","","En clair : l'agence ou le bureau qui a vendu le billet.\n\nQuestion ouverte : billets achetés en ligne et agences de voyages."];
FR[114]=["","Miami accepte la compétence MC99 mais se dessaisit (forum non conveniens) → la Martinique refuse ensuite une affaire renvoyée et non choisie : plus de 10 ans de ping-pong.","","En clair : le forum non conveniens peut ruiner le choix du demandeur prévu à l'art. 33.\n\nPourquoi : exemple parfait de conflit entre common law et MC99.\n\nAstuce : FNC = fréquent en common law, rare en droit civil."];
FR[115]=["","Résident de l'Oregon blessé sur Montréal–Paris, billet acheté en ligne depuis l'Oregon : rejeté faute de compétence personnelle spécifique.","Daimler v. Bauman (« at home »), Bristol-Myers Squibb : la 5e juridiction est largement inutilisable.","En clair : même si MC99 désigne les États-Unis, le droit constitutionnel américain peut bloquer.\n\nPourquoi : la 5e juridiction voulue par les États-Unis a été vidée par leurs propres juges."];
FR[116]=["","La 5e juridiction échoue pour un affréteur volant occasionnellement (« how much is enough? ») ; pas de compétence sur une société mère dont la filiale desservait les États-Unis.","","En clair : il faut une vraie présence commerciale du transporteur lui-même.\n\nAstuce : charters = zone grise de la 5e juridiction."];
FR[117]=["Art. 35 : extinction, pas prescription","Droit éteint après 2 ans à compter de l'arrivée, de la date où l'avion aurait dû arriver, ou de l'arrêt du transport. Pas de suspension ; la loi du for ne régit que le calcul.","Proctor v. Jetway : « gone forever ». Laroche v. Spirit of Adventure [2009] EWCA Civ 12.","En clair : un délai de forclusion, pas une prescription qu'on peut interrompre.\n\nPiège : ne pas l'appliquer au Règl. 261 (Cuadrench Moré).\n\nAstuce : la loi du for compte les jours, c'est tout."];
FR[118]=["Arbitrage (art. 34)","Fret seulement, convenu par écrit, siège dans un for de l'art. 33(1) au choix du demandeur, le tribunal appliquant MC99.","","En clair : pas d'arbitrage pour les passagers.\n\nPourquoi : entre professionnels du fret, l'arbitrage est courant."];
FR[119]=["","Règl. 261 : Bruxelles I bis, lieu de départ ou d'arrivée. Les règles « consommateurs » ne s'appliquent pas aux contrats de transport.","","En clair : pour une indemnité 261, tu peux agir au lieu de départ ou d'arrivée.\n\nPiège : ne pas utiliser l'art. 33 MC99 pour une demande 261."];
FR[120]=["Un passager peut-il agir au lieu de départ selon l'art. 33 MC99 ?","Pas en tant que tel — seulement s'il est aussi le domicile, le siège, le lieu de conclusion du contrat, ou (aller-retour) la destination.","","En clair : départ ≠ for automatique.\n\nExemple : aller-retour Amsterdam–Bali acheté à Amsterdam → Amsterdam est destination et lieu de conclusion → OK."];
FR[121]=["Appliquer l'art. 33 MC99 à une demande 261","C'est Bruxelles I bis qui s'applique (Rehder).","","En clair : deux régimes, deux règles de compétence.\n\nAstuce : MC99 → art. 33 ; 261 → Bruxelles I bis."];
FR[122]=["Art. 18(1) : responsabilité fret","Responsabilité objective pour destruction, perte ou avarie « à la seule condition que l'événement ayant causé le dommage se soit produit pendant le transport aérien » — c'est la cause, pas le dommage, qui doit survenir en transit.","","En clair : si la panne de froid a lieu pendant le transport aérien, peu importe quand les asperges pourrissent.\n\nPourquoi : base de tout cas fret.\n\nLien : Wealmoor v. KLM."];
FR[123]=["","Asperges : « événement » = tout ce qui arrive — couper la réfrigération en est un. Winchester Fruit rejeté ; le vice propre exige d'abord la preuve d'un soin raisonnable (Albacora ; Volcafe).","","En clair : lecture très large de « événement », favorable aux chargeurs.\n\nPourquoi : arrêt anglais récent (2025), à citer pour le fret.\n\nAstuce : le transporteur ne peut invoquer le vice propre que s'il prouve d'abord avoir pris soin de la marchandise."];
FR[124]=["Art. 18(2) : quatre défenses limitatives","(a) vice propre · (b) emballage défectueux fait par un autre que le transporteur · (c) guerre ou conflit armé · (d) fait du prince (entrée, sortie, transit) — plus l'art. 20.","","En clair : liste fermée.\n\nPiège : pas de défense météo, grève ou « mesures raisonnables » pour la perte de fret.\n\nAstuce : « Vice, Emballage, Guerre, Douane »."];
FR[125]=["« Le transporteur a pris toutes les mesures raisonnables » pour du fret perdu","Cette défense n'existe que pour le retard (art. 19). Pour perte ou avarie : seulement les quatre défenses de l'art. 18(2). Pas de défense météo ou grève.","","En clair : erreur classique de confusion entre art. 18 et 19.\n\nAstuce : « mesures raisonnables » = retard uniquement."];
FR[126]=["","Chanvre saisi par la douane pendant le transport = fait de l'autorité publique (art. 18(2)(d)).","","En clair : la saisie douanière exonère le transporteur.\n\nAstuce : exemple concret de la défense (d)."];
FR[127]=["","Or et billets volés à Toronto Pearson : une valeur déclarée en douane n'est pas une déclaration spéciale d'intérêt → plafond appliqué.","","En clair : des millions volés, indemnisés à une fraction minuscule.\n\nPourquoi : illustre le caractère infranchissable du plafond fret.\n\nAstuce : déclaration spéciale = formalité précise au moment de la remise."];
FR[128]=["Qui peut agir pour le fret ?","Expéditeur et destinataire nommés sur la LTA (art. 14). France : seulement eux (Cass. com. 8.7.2014). Common law : le vrai propriétaire aussi (Gatewhite v. Iberia 1990 ; Western Digital v. BA 2001).","Assureurs subrogés via l'art. 15 (Paramount v. BA).","En clair : la qualité pour agir varie selon le pays.\n\nPiège : en France, le propriétaire non nommé sur la LTA ne peut pas agir.\n\nAstuce : Allemagne = mandant non révélé."];
FR[129]=["La lettre de transport aérien","Preuve du contrat et reçu non négociable — pas un titre représentatif. LTA mère : transporteur–transitaire. LTA maison : transitaire–expéditeur.","Le régime fret vient du Protocole additionnel de Montréal n° 4.","En clair : la LTA prouve le contrat mais ne transfère pas la propriété (contrairement au connaissement maritime).\n\nAstuce : MAWB = compagnie ; HAWB = transitaire."];
FR[130]=["La règle du colis (art. 22(4))","Seul le poids des colis concernés compte, sauf si la perte affecte la valeur d'autres colis sous la même LTA.","Applied Implants v. Lufthansa Cargo ; Motorola v. FedEx.","En clair : un colis de 5 kg perdu sur un lot de 500 kg → plafond calculé sur 5 kg.\n\nException : si la perte rend tout le lot inutilisable (pièce d'une machine)."];
FR[131]=["","Des plafonds plus élevés dans un contrat-cadre logistique ne s'appliquent pas aux LTA ultérieures sauf incorporation expresse.","","En clair : il faut viser le contrat-cadre dans chaque LTA.\n\nAstuce : prudence contractuelle pour les chargeurs."];
FR[132]=["Multimodal : art. 38 et 18(3)–(4)","MC99 ne couvre que la partie aérienne ; période aérienne = marchandise sous la garde du transporteur. Le transport terrestre hors aéroport n'est pas aérien — MAIS une perte non localisée lors du chargement/livraison/transbordement est présumée aérienne, et la substitution non autorisée d'un autre mode est réputée aérienne.","","En clair : trois règles : garde, présomption, fiction de substitution.\n\nPourquoi : décide entre 26 DTS/kg infranchissable (MC99) et 8,33 DTS/kg franchissable (CMR).\n\nExemple : camion sous numéro de vol sans accord de l'expéditeur → réputé aérien."];
FR[133]=["8,33 DTS/kg","Plafond CMR pour un trajet routier — franchissable en cas de faute lourde (art. 29 CMR).","v. MC99 26 DTS/kg, infranchissable : les chargeurs invoquent la CMR.","En clair : plafond plus bas mais qui peut sauter.\n\nPourquoi : en cas de vol volontaire sur la route, la CMR peut rapporter plus.\n\nAstuce : la CMR n'est pas fournie à l'examen."];
FR[134]=["","Disques durs Singapour–Dublin ; trajet routier Paris–Dublin sous numéro de vol Air France, faux braquage au pays de Galles → la CMR s'applique impérativement à un trajet routier international.","Le BGH (2008) n'est pas d'accord : § 452 HGB.","En clair : la LTA ne transforme pas un camion en avion.\n\nPourquoi : arrêt clé du multimodal.\n\nAstuce : Angleterre = CMR ; Allemagne = droit allemand du multimodal."];
FR[135]=["Victoria Sales v. Emery (2d Cir. 1990) v. Rolls Royce v. Heavylift (2000)","« Aérodrome » de Varsovie : aéroport délimité par la clôture (majorité US) v. zone aéroportuaire fonctionnelle incluant les entrepôts hors site (Angleterre).","","En clair : où s'arrête l'aéroport ?\n\nPourquoi : sous Varsovie, la notion d'aérodrome décidait de l'application.\n\nAstuce : MC99 a supprimé le mot au profit de la « garde »."];
FR[136]=["Sous MC99 : garde v. géographie","Allemagne/Autriche : la garde l'emporte (OGH 2011 ; BGH I ZR 91/10). US au cas par cas : Expeditors (2018), Unitrans (2024 : être côté piste ne suffit pas), Royal & Sun Alliance v. Air General (2025 : 13 jours dehors en attente de douane = encore aérien).","","En clair : la question est « qui avait la marchandise et à quel titre ? ».\n\nAstuce : Europe = garde ; US = analyse du rôle du transporteur."];
FR[137]=["","Tout transport terrestre couvert par la LTA comptait comme « livraison » — même à 240 km de JFK.","","En clair : lecture très large de la présomption de l'art. 18(4).\n\nAstuce : à citer en faveur de l'application de MC99."];
FR[138]=["Courrier aérien (art. 2(2)–(3))","Le transporteur n'est responsable qu'envers l'administration postale ; MC99 ne s'applique pas autrement. Un expéditeur ne peut pas attaquer la compagnie pour une carte postale perdue.","Courrier v. fret : critère formel — bordereau CN 38/41 v. LTA.","En clair : pour le courrier, c'est La Poste qui répond à l'expéditeur.\n\nPiège : le courrier n'est pas du fret parce qu'il est en soute.\n\nAstuce : le document décide."];
FR[139]=["Union postale universelle","1874, Berne, 192 membres, institution spécialisée de l'ONU : territoire postal unique, liberté de transit, service universel. Les opérateurs désignés sont les acteurs.","","En clair : le cadre international du courrier, à côté de MC99.\n\nAstuce : Chicago renvoie à l'UPU pour le courrier (Annexe 9), sauf sûreté et marchandises dangereuses."];
FR[140]=["Animaux sauvages non déclarés : le transporteur doit-il vérifier chaque colis ?","Non. L'expéditeur répond des formalités et de l'exactitude des informations (MC99 art. 6, 10, 16 ; Annexe 9). Le filtrage cherche les menaces, pas la conformité.","Cour suprême néerlandaise, 16.9.2022.","En clair : le transporteur se fie aux déclarations.\n\nPourquoi : question possible sur la CITES et le trafic d'espèces."];
FR[141]=["Règl. 261/2004 — les bases","Adopté le 11.2.2004, applicable depuis le 17.2.2005. Remplace le Règl. 295/91 (refus d'embarquement seulement). Environ 100 arrêts de la CJUE — l'acte de l'UE le plus contentieux.","Point faible : 2 passagers sur 3 ne réclament jamais, ~22 % sont payés.","En clair : le régime de protection des passagers le plus abouti au monde, copié ailleurs.\n\nPourquoi : contexte pour une dissertation.\n\nAstuce : objectifs = haut niveau de protection + neutralité concurrentielle."];
FR[142]=["Champ (art. 3(1))","(a) départ d'un aéroport de l'UE, tout transporteur · (b) d'un pays tiers vers l'UE sur un transporteur communautaire, sauf avantages ou indemnisation reçus là-bas.","UE 27 + EEE + Suisse + régions art. 355 TFUE.","En clair : depuis l'UE = toujours ; vers l'UE = seulement compagnie européenne.\n\nExemple : New York–Paris sur Delta → non ; sur Air France → oui.\n\nAstuce : chaque vol séparément (Schenkel)."];
FR[143]=["","Aller et retour sont des vols distincts : le vol retour doit remplir l'art. 3(1)(b) à lui seul.","","En clair : un aller-retour depuis l'UE ne rend pas le retour automatiquement couvert.\n\nExemple : Paris–Dubaï–Paris sur Emirates → le retour (Dubaï→Paris, compagnie non UE) n'est pas couvert."];
FR[144]=["","Pas de licence d'exploitation selon le Règl. 1008/2008 → pas de transporteur communautaire → pas de droit sous l'art. 3(1)(b).","","En clair : c'est la licence qui fait le transporteur communautaire.\n\nAstuce : vérifier la licence, pas le siège apparent."];
FR[145]=["Passagers exclus","Tarifs gratuits ou réduits non accessibles au public (billets fidélité inclus). Tarif sponsoring (VO v. SATA) exclu ; bébé gratuit sans siège (YE v. Vueling) exclu.","Qatar (C-516/23) : payer seulement les taxes ≠ gratuit.","En clair : il faut un billet émis et payé, accessible au public.\n\nAstuce : les miles (fidélité) sont couverts."];
FR[146]=["","Un passager qui ne peut prouver son enregistrement ne peut être privé d'indemnisation, sauf s'il est établi qu'il n'a pas été transporté.","","En clair : la charge de la preuve ne pèse pas excessivement sur le passager.\n\nAstuce : la révision de 2026 supprime l'enregistrement comme condition."];
FR[147]=["","Vols en correspondance sur une seule réservation = un tout : le règlement s'applique même au tronçon entre deux aéroports marocains.","","En clair : on regarde le voyage du premier départ à la destination finale.\n\nPourquoi : base de toute la jurisprudence « correspondances ».\n\nAstuce : réservation unique = un seul voyage."];
FR[148]=["","UE → pays tiers via un autre pays tiers : retard sur le tronçon en partage de code opéré par un partenaire non UE → action contre le transporteur communautaire du premier tronçon.","","En clair : la compagnie européenne paie pour le retard de son partenaire.\n\nExemple KLM : paie pour un vol Delta retardé sur une réservation KL depuis l'UE."];
FR[149]=["","Image inversée : pays tiers → UE via l'UE ; retard sur le premier tronçon non UE → action contre le transporteur communautaire du second vol.","","En clair : même logique que ČSA, dans l'autre sens.\n\nAstuce : il faut un transporteur communautaire quelque part sur le voyage, avec départ ou arrivée UE."];
FR[150]=["","Départ et arrivée finale dans des pays tiers avec escale dans l'UE (New York–Amsterdam–Istanbul) : le règlement ne s'applique pas.","","En clair : traverser l'UE ne suffit pas.\n\nAstuce : départ final et destination finale hors UE = exclu."];
FR[151]=["","Réservation Lufthansa unique, tous les tronçons opérés par United : c'est le transporteur effectif non UE qui paie.","","En clair : ici le départ est dans l'UE (art. 3(1)(a)) → tout transporteur est couvert, y compris United.\n\nAstuce : la débitrice = l'operating carrier."];
FR[152]=["","Des transporteurs sans lien combinés par une agence en un seul billet à prix global : c'est quand même un vol avec correspondance.","","En clair : c'est la réservation unique qui compte, pas les accords entre compagnies.\n\nAstuce : art. 2(h)."];
FR[153]=["","Transporteur effectif = exploite le vol + contrat avec le passager (pas forcément avec lui). Il décide de la route, des horaires, des ventes : en wet lease, c'est le preneur.","","En clair : celui qui décide opérationnellement paie.\n\nExemple : TUI loue un avion avec équipage à une autre compagnie → TUI (le preneur) est le transporteur effectif.\n\nLien : codifié par la révision de 2026."];
FR[154]=["Refus d'embarquement (art. 2(j), 4)","D'abord des volontaires ; puis indemnisation immédiate + réacheminement/remboursement + prise en charge. Pas de défense de circonstances extraordinaires : seulement des motifs raisonnables (santé, sécurité, sûreté, documents insuffisants).","","En clair : le surbooking coûte toujours.\n\nPiège : ne jamais accepter les « circonstances extraordinaires » pour un refus d'embarquement.\n\nAstuce : chaque vol est examiné séparément."];
FR[155]=["","Refuser des passagers pour réduire le retard des autres après une tempête = refus d'embarquement. Refus anticipé : le passager n'a pas besoin de se présenter.","Aussi Rodríguez Cachafeiro (C-321/11), D.Z. v. Blue Air (C-584/18).","En clair : les choix d'organisation de la compagnie ne sont pas des « motifs raisonnables ».\n\nExemple : on t'annonce par mail que tu n'as plus de place → refus d'embarquement, pas besoin d'aller à l'aéroport."];
FR[156]=["Annulation : pas d'indemnisation si…","Informé ≥ 2 semaines avant · 2 semaines–7 jours avec réacheminement −2h/+4h · < 7 jours avec réacheminement −1h/+2h (art. 5(1)(c)) · ou circonstances extraordinaires (art. 5(3)).","Prise en charge et remboursement/réacheminement toujours dus.","En clair : prévenir tôt ou proposer un vol très proche évite l'indemnité.\n\nPiège : l'information donnée à l'agence non transmise ne compte pas (Krijgsman).\n\nAstuce : 14 jours / 7 jours / moins."];
FR[157]=["Annulation ou pas ?","Retour à l'aéroport de départ = annulation (Sousa Rodríguez, C-83/10). Escale technique avec ~2h de retard = non (Wunderlich, C-32/16). Avancé de plus d'1h = annulation (Corendon). Reporté de moins de 3h = non (C-395/20).","","En clair : quelques qualifications réflexes.\n\nAstuce : un vol avancé de plus d'une heure, c'est une annulation (le passager peut le rater)."];
FR[158]=["","Préavis donné à l'agence de voyages mais non transmis = passager non informé → indemnisation due. Le transporteur répond de ses intermédiaires.","","En clair : la compagnie ne peut pas se cacher derrière l'agence.\n\nAstuce : recours éventuel contre l'agence selon le droit national, pas selon l'art. 13."];
FR[159]=["","Retard de 3 heures ou plus à la destination finale = indemnisation comme une annulation (égalité de traitement), même défense de circonstances extraordinaires.","Confirmé : Nelson / TUI (C-581/10, 2012) et Amend (C-413/11).","En clair : le texte ne prévoit pas d'indemnité pour retard, la CJUE l'a créée.\n\nCritique : réécriture judiciaire, art. 29 MC99 non discuté.\n\nAstuce : 3h à l'arrivée finale, mesurées à l'ouverture d'une porte."];
FR[160]=["","Le retard se mesure à la destination finale ; arrivée = quand une porte s'ouvre.","Révision 2026 : « on blocks » (à l'arrêt au poste) à la place.","En clair : ce n'est ni l'atterrissage ni l'arrivée au parking, c'est l'ouverture de la porte.\n\nExemple : roues au sol à 2h50 de retard, porte ouverte à 3h05 → indemnisation."];
FR[161]=["","Distance = orthodromie entre le premier départ et la destination finale, pas la route suivie.","","En clair : ligne droite sur le globe, sans compter les détours ou correspondances.\n\nAstuce : décide du montant 250/400/600."];
FR[162]=["Seuils de prise en charge (art. 6)","2h (≤ 1 500 km) · 3h (intra-UE > 1 500 km et autres 1 500–3 500 km) · 4h (autres). Hôtel si départ le lendemain. Option remboursement après 5h.","","En clair : repas et rafraîchissements dès ces seuils.\n\nAstuce : mêmes paliers de distance que l'indemnisation (250/400/600)."];
FR[163]=["Détails de l'indemnisation (art. 7)","−50 % si réacheminé avec arrivée dans les 2h/3h/4h. Payée en argent ; bons seulement avec accord signé. Dans la monnaie de résidence du passager (Delfly, C-356/19).","","En clair : la compagnie ne peut pas imposer un bon d'achat.\n\nAstuce : réduction de 50 % si le réacheminement arrive presque à l'heure."];
FR[164]=["Remboursement ou réacheminement (art. 8)","Prix intégral du billet sous 7 jours (plus retour au premier point de départ si pertinent), ou réacheminement dans les meilleurs délais, ou plus tard à la convenance du passager.","Commission d'agence : Harms v. Vueling (C-601/17).","En clair : le passager choisit entre être remboursé ou continuer son voyage.\n\nAstuce : en retard, l'option remboursement s'ouvre après 5h."];
FR[165]=["","Pas de circonstances « super-extraordinaires » : la prise en charge (art. 9) est due même en circonstances extraordinaires (cendres volcaniques), sans limite de durée, dans la mesure du nécessaire et du raisonnable.","","En clair : volcan islandais, la compagnie ne doit pas l'indemnité, mais doit l'hôtel et les repas.\n\nPiège : la défense de l'art. 5(3) ne vise que l'indemnisation.\n\nAstuce : « care is always owed »."];
FR[166]=["30 · 50 · 75 %","Remboursement en cas de surclassement inférieur (déclassement), selon la distance (art. 10).","Economy Comfort est un service, pas une classe.","En clair : tu as payé la business, tu voles en éco → remboursement d'une partie du billet.\n\nAstuce : pas de supplément à payer en cas de surclassement."];
FR[167]=["Arrivée prévue 10h00. Roues au sol 12h50, porte ouverte 13h05. Indemnisation ?","Oui : arrivée = ouverture d'une porte (Henning) → 3h05 à la destination finale ≥ 3h (Sturgeon).","","En clair : c'est l'ouverture de la porte qui compte.\n\nAstuce : avec le règlement 2026 (applicable fin 2027), ce serait « on blocks »."];
FR[168]=["Compagnie américaine, New York → Paris, 5h de retard. Règl. 261 ?","Non : d'un pays tiers vers l'UE, l'art. 3(1)(b) exige un transporteur communautaire.","","En clair : Delta ou United vers l'UE = pas de 261.\n\nAttention : Paris → New York sur la même compagnie = 261 s'applique (départ UE)."];
FR[169]=["Paris–Dubaï–Paris sur Emirates ; le retour Dubaï→Paris a 4h de retard. Règl. 261 ?","Non : aller et retour sont distincts (Emirates v. Schenkel) ; le retour part d'un pays tiers sur un transporteur non communautaire.","","En clair : l'aller (depuis Paris) aurait été couvert, le retour non.\n\nAstuce : chaque vol est testé seul."];
FR[170]=["Indemniser un retard de 2h50 à l'arrivée","3 heures à la destination finale, mesurées à l'ouverture d'une porte.","","En clair : 2h50 = pas d'indemnité (mais prise en charge possible).\n\nAstuce : vérifie toujours l'heure d'ouverture des portes."];
FR[171]=["Circonstances extraordinaires (art. 5(3))","Test Wallentin-Hermann : (1) pas inhérent à l'exercice normal de l'activité du transporteur, ET (2) échappant à sa maîtrise effective ; puis (3) inévitable même avec toutes les mesures raisonnables. Charge de la preuve sur le transporteur.","Ne vise que l'indemnisation — jamais la prise en charge.","En clair : trois étapes, toutes à prouver par la compagnie.\n\nPourquoi : c'est LA défense des compagnies, examinée dans presque tous les cas 261.\n\nAstuce : en pratique, le test revient à « interne ou externe à la compagnie ? » + « a-t-elle tout fait ? »."];
FR[172]=["","Les problèmes techniques ne sont en principe pas extraordinaires : un problème découvert en maintenance ou dû à un défaut de maintenance est inhérent.","Le test est devenu, en substance, interne v. externe.","En clair : réparer les avions fait partie du métier.\n\nPourquoi : arrêt fondateur du test en deux branches.\n\nAstuce : « inhérent ET maîtrisable » = pas extraordinaire."];
FR[173]=["","La défaillance prématurée de pièces, même indétectable en maintenance, n'est pas extraordinaire. Exceptions : défaut de fabrication caché affectant la flotte révélé par le constructeur/l'autorité, sabotage, terrorisme.","","En clair : une pièce qui lâche trop tôt reste le problème de la compagnie.\n\nExceptions à retenir : défaut caché révélé par le constructeur, sabotage, terrorisme.\n\nLien : la révision de 2026 a gardé cette logique."];
FR[174]=["","Angleterre, même solution : une fois identifié, un problème technique fait partie de l'activité normale.","","En clair : la Court of Appeal suit la même ligne que la CJUE.\n\nAstuce : cite-le avec Van der Lans."];
FR[175]=["","Défaillance prématurée d'une pièce « on-condition » : pas extraordinaire. Défaut de conception caché révélé par le constructeur (service bulletin) : peut être extraordinaire.","","En clair : distinction entre l'usure (interne) et le défaut de conception révélé par le fabricant (externe).\n\nAstuce : c'est l'application concrète de l'exception de Van der Lans."];
FR[176]=["","Impact d'oiseau = extraordinaire. Mais le temps perdu pour une inspection inutile n'est pas excusé ; en cas de causes mixtes, seule la part extraordinaire est déduite.","","En clair : l'oiseau excuse, pas la lenteur de la compagnie ensuite.\n\nExemple : 2h de retard dû à l'oiseau + 2h d'inspection inutile → 4h, on retire 2h → reste 2h → pas d'indemnité ; mais si cela dépasse 3h, si.\n\nAstuce : découper le retard par cause."];
FR[177]=["Événements externes qui comptent","Débris sur la piste endommageant un pneu (Germanwings, C-501/17) · carburant sur la piste (Moens, C-159/18) · avion d'une autre compagnie qui heurte un avion en stationnement (AirHelp, C-264/20).","","En clair : ce qui vient de l'extérieur et que la compagnie ne maîtrise pas.\n\nAstuce : ne pas oublier l'étape 3 — a-t-elle pris toutes les mesures raisonnables ?"];
FR[178]=["","Passager perturbateur = extraordinaire, invocable pour le vol suivant du même avion. Mais mesures raisonnables = réacheminement par l'alternative la plus rapide, y compris sur d'autres compagnies.","","En clair : la compagnie peut invoquer l'incident pour la rotation suivante, mais doit tout faire pour réacheminer vite.\n\nPourquoi : clé du cas Skarsgard.\n\nAstuce : « autres compagnies incluses » sauf sacrifice intolérable."];
FR[179]=["Événements internes qui ne comptent pas","Grève de son propre personnel (AirHelp v. SAS, C-28/20) · grève sauvage par arrêts maladie après une restructuration (Krüsemann, C-195/17) · mort subite du copilote (TAP, C-156/22).","","En clair : tout ce qui touche au personnel de la compagnie reste interne.\n\nContraste : grève des contrôleurs aériens = externe.\n\nAstuce : « mon personnel = mon problème »."];
FR[180]=["","Collision avec l'escalier mobile de la compagnie : pas extraordinaire. Le camion de catering d'un tiers : peut l'être.","Incohérence critiquée en cours.","En clair : même type d'incident, résultat différent selon à qui appartient le véhicule.\n\nPourquoi : utile pour montrer un regard critique sur la jurisprudence."];
FR[181]=["Grèves de tiers","Les grèves des contrôleurs aériens ou du personnel aéroportuaire sont externes — l'annexe I du Règl. 2026/2202 le dit expressément. Cyberattaques : question ouverte.","","En clair : grève d'un tiers = circonstance extraordinaire (sous réserve des mesures raisonnables).\n\nAstuce : cyberattaque → discute les deux côtés."];
FR[182]=["M. Skarsgard : retour retardé de 21h — l'avion arrivant a fait demi-tour pour un passager perturbateur, puis impact d'oiseau, puis équipage hors temps de service. Indemnisation ?","Probablement non : deux événements externes (TAP ; Pešková), invocables pour la rotation suivante ; le repos de l'équipage en est la conséquence. Contre : toutes les mesures raisonnables (équipage de réserve, autre avion, autres compagnies — TAP) ? Prise en charge due de toute façon (McDonagh).","","En clair : c'est le sujet d'examen type (Q3, 20 %).\n\nPlan : champ 261 (aller-retour Stockholm–Denpasar, retour sur Viking = transporteur communautaire ?) → retard ≥ 3h (Sturgeon) → art. 5(3) en trois étapes → prise en charge (McDonagh).\n\nAstuce : conclure en pesant les deux côtés."];
FR[183]=["Défaillance moteur découverte avant le départ. Circonstance extraordinaire ?","Non (Wallentin-Hermann ; Van der Lans) — sauf défaut de fabrication caché révélé par le constructeur ou une autorité, sabotage ou terrorisme.","","En clair : problème technique = interne par défaut.\n\nAstuce : cherche dans l'énoncé un indice de défaut caché ou de sabotage."];
FR[184]=["Oublier la troisième étape","Même un événement externe n'exonère que si le transporteur a pris toutes les mesures raisonnables, y compris le réacheminement sur d'autres compagnies (TAP).","","En clair : « c'était un oiseau » ne suffit pas.\n\nAstuce : toujours demander : qu'a fait la compagnie ensuite ?"];
FR[185]=["Refuser la prise en charge pour circonstances extraordinaires","La défense ne couvre que l'indemnisation (McDonagh).","","En clair : repas et hôtel restent dus.\n\nAstuce : 5(3) → art. 7 seulement."];
FR[186]=["Art. 15 et 16","Art. 15 : ni renonciation ni clause restrictive. Art. 16 : chaque État membre désigne un organisme national de contrôle avec des sanctions dissuasives.","LOT (C-597/20) : les États peuvent habiliter ces organismes à ordonner le paiement.","En clair : on ne peut pas faire signer au passager qu'il renonce à ses droits.\n\nExemple : clause interdisant de céder sa créance à une société de recouvrement → nulle (Eventmedia)."];
FR[187]=["","Délai de prescription des demandes 261 = droit national (1 à 10 ans), pas l'art. 35 MC99.","","En clair : la durée dépend du pays du juge.\n\nPiège : ne pas appliquer les 2 ans de MC99.\n\nLien : la révision de 2026 impose 9 mois pour réclamer à la compagnie."];
FR[188]=["","Les clauses interdisant de céder sa créance dans les conditions de transport sont nulles (art. 15).","","En clair : les sociétés de réclamation (AirHelp, Flightright) peuvent racheter tes droits.\n\nPourquoi : explique l'explosion des contentieux."];
FR[189]=["Le Tribunal et les droits des passagers","Depuis le 1.10.2024, le Tribunal de l'UE traite les questions préjudicielles sur les droits des passagers (art. 50 ter du Statut). L'Allemagne est le premier pays à renvoyer.","","En clair : ce n'est plus la Cour de justice elle-même qui répond en première ligne.\n\nAstuce : détail pour une dissertation sur l'application du 261."];
FR[190]=["23.10.2027","Date d'application du Règl. (UE) 2026/2202 (JO 2.10.2026, en vigueur 22.10.2026). Faits antérieurs → Règl. 261/2004 tel qu'interprété par la CJUE.","","En clair : le nouveau règlement existe mais ne s'applique pas encore.\n\nPiège : ne pas l'appliquer à des faits de 2026.\n\nAstuce : le mentionner comme « the forthcoming regime »."];
FR[191]=["Règl. 2026/2202 : ce qui change","Garde 3h et 250/400/600 € · arrivée = « on blocks » · palier 7–14 jours supprimé · retard sur le tarmac (info dès 30 min, débarquement après 2h) · correspondance manquée (alternative sous 5h) · 9 mois pour réclamer, 30 jours pour payer · hôtel plafonné à 3 nuits.","Définit les circonstances extraordinaires avec une annexe I ouverte.","En clair : codifie la jurisprudence et ajoute de nouveaux droits.\n\nPiège : les seuils n'ont pas été relevés à 4–6h.\n\nAstuce : « mêmes montants, mêmes 3h, plus de règles »."];
FR[192]=["« La révision de 2026 a relevé le seuil à 4–6 heures »","C'était la position du Conseil en 2025. Le texte final garde 3 heures et les mêmes montants.","","En clair : la conciliation a ramené le seuil à 3h.\n\nAstuce : Conseil 2025 = 4–6h ; texte final = 3h."];
FR[193]=["≈ 200 millions €","Coût EU261 de KLM en 2025 (hors frais juridiques) ; plus de 11 000 procès en 2026, presque tous via des sociétés de réclamation.","Un long-courrier retardé ≈ 150 000 € d'exposition.","En clair : le 261 coûte très cher aux compagnies.\n\nPourquoi : utile pour discuter l'équilibre du système."];
FR[194]=["PMR : trois couches","Droits de l'homme : CDPH art. 9 (accessibilité) · droit aérien public : Annexe 9 Chicago section F (17e éd. 2025) · UE : Règl. 1107/2006 et art. 11 Règl. 261.","États-Unis : Air Carrier Access Act. Canada : DORS/2019-244.","En clair : la protection des personnes à mobilité réduite vient de trois étages de règles.\n\nAstuce : CDPH → OACI → UE."];
FR[195]=["PMR maltraitée sur un vol international","Humiliation sans lésion corporelle → pas de dommages-intérêts (art. 17 + 29 MC99, Stott). Le remède est l'action publique : CAA, DOT américain (amende de 50 M$ à American Airlines).","Mather v. easyJet : le Règl. 1107/2006 ne réduit pas la responsabilité MC99.","En clair : la victime ne touche rien, mais la compagnie peut être sanctionnée.\n\nAstuce : exclusivité → pas de dommages privés ; régulateur → sanctions publiques."];
FR[196]=["Le RGPD en 3 chiffres","7 principes (art. 5) · 6 bases légales (art. 6) · catégories particulières dont la biométrie (art. 9). Surveillance à grande échelle → AIPD (art. 35–36).","","En clair : tout traitement doit avoir une base légale et respecter les principes.\n\nExemple : reconnaissance faciale à l'embarquement = biométrie → art. 9 + AIPD."];
FR[197]=["Amendes RGPD dans l'aérien","Reconnaissance faciale AENA, AIPD insuffisante : 10,04 M€ · fuite de données British Airways : 20 M£ (183,39 M£ envisagés) · Emirates MEDIF : 180 000 €.","","En clair : exemples concrets à citer si une question touche aux données.\n\nAstuce : AENA = AIPD ; BA = sécurité ; Emirates = transparence et conservation."];
FR[198]=["L'AI Act et l'aviation","Annexe I section B pour les aéronefs sans équipage seulement ; aviation habitée via l'art. 108 — l'AESA « tient compte » des exigences. Niveaux AESA 1A–3B.","","En clair : l'AI Act touche surtout les drones directement.\n\nAstuce : contrôle humain exclut le niveau 3B."];
FR[199]=["Tarification algorithmique (art. 101–102 TFUE)","Collusion par logiciel = infraction claire · fournisseur commun : dépend de la connaissance (Eturas, VM Remonts) · convergence indépendante : zone grise. Art. 102 : tarification personnalisée par une compagnie dominante sur une liaison.","La discrimination tarifaire n'est pas illégale en soi.","En clair : l'algorithme n'excuse pas une entente.\n\nExemple : sièges 4A/4B/4C vendus 325/175/85 € = pas illégal en soi."];
FR[200]=["Pièces contrefaites","Un faux certificat sur une pièce saine la rend inéligible, pas forcément défectueuse. Récupérer d'abord par les contrats (garanties, indemnités), puis dol, fraude, négligence.","AOG Technics (Royaume-Uni, 2023).","En clair : la directive produits aide peu (le vrai fabricant est souvent introuvable).\n\nAstuce : contrat → délit → assurance."];
FR[201]=["Qui est un tiers ?","Quelqu'un sans lien contractuel avec l'exploitant : un piéton, le propriétaire d'une maison touchée par des débris. Les agents d'escale agissant pour le transporteur ne sont pas des tiers.","","En clair : les « tiers à la surface » = les victimes au sol.\n\nAstuce : passagers → MC99 ; tiers → Rome 1952 ou droit national."];
FR[202]=["","Un aéronaute en ballon est responsable de tout le dommage, y compris les cultures piétinées par la foule venue l'aider (~70 $ sur ~90 $) : la racine de la responsabilité objective pour les dommages au sol.","","En clair : en pratiquant une activité dangereuse, on assume aussi les réactions qu'elle provoque.\n\nPourquoi : arrêt fondateur, à citer en introduction d'une question sur les tiers."];
FR[203]=["Rome 1952, art. 1","Réparation « sur la seule preuve que le dommage a été causé par un aéronef en vol ou par une personne ou une chose en tombant ». Pas de réparation pour un dommage indirect ou le simple survol conforme (bruit).","","En clair : responsabilité objective de l'exploitant pour les dommages au sol.\n\nPiège : pas d'action pour le bruit d'un survol légal."];
FR[204]=["Rome 1952 : condition territoriale","Dommage dans un État contractant causé par un aéronef immatriculé dans un autre État contractant. Les crashs intérieurs ne sont pas couverts.","","En clair : il faut un avion « étranger » et deux États parties.\n\nExemple : avion italien qui s'écrase en Italie → droit italien, pas Rome."];
FR[205]=["Rome 1952 : en vol & exploitant","En vol : de la mise en puissance pour le décollage à la fin du roulement à l'atterrissage. Exploitant : la personne qui fait usage de l'aéronef (art. 2) ; le propriétaire immatriculé est présumé exploitant (art. 3).","","En clair : le roulage au sol n'est pas « en vol ».\n\nAstuce : responsabilité canalisée sur l'exploitant."];
FR[206]=["Rome 1952 : plafonds & for","Plafonds selon le poids (art. 11), 500 000 francs par personne ; illimité seulement pour un acte délibéré visant à causer un dommage. Seuls les tribunaux de l'État du dommage (art. 20). 2 ans, max 3.","","En clair : plafond très difficile à faire sauter.\n\nPiège : la faute lourde ne suffit pas, il faut l'intention de nuire."];
FR[207]=["","Parties à Rome 1952 — aucun grand État aéronautique (ni France, Allemagne, Pays-Bas, Royaume-Uni, États-Unis, Suisse, Japon, Chine). Jamais appliquée en justice.","Protocole de Montréal 1978 : 12 parties.","En clair : convention en vigueur mais quasi morte.\n\nAstuce : « about 50 parties, none of the major aviation States »."];
FR[208]=["Pourquoi Rome a échoué","Les grands États n'ont jamais adhéré ; plafonds trop bas ; condition « aéronef étranger » qui exclut la plupart des accidents au sol (intérieurs) ; le droit national protège mieux les victimes.","","En clair : quatre raisons à citer en dissertation.\n\nAstuce : « tous les chemins mènent à Rome — ou pas ? »."];
FR[209]=["125 000 DTS","Par personne selon le Protocole de Montréal 1978, qui exclut aussi les dommages nucléaires.","","En clair : le protocole a converti et relevé les plafonds de Rome.\n\nAstuce : seulement 12 parties."];
FR[210]=["Catastrophes au sol, toutes sous droit national","Lockerbie 1988 (11 morts au sol) · Bijlmermeer 1992 (39) · 11 septembre · Überlingen 2002 (collision en vol, Skyguide).","Jamais sous la Convention de Rome.","En clair : en pratique, c'est toujours le droit national qui a joué.\n\nPourquoi : preuve de l'échec du système de Rome."];
FR[211]=["Quatre modèles nationaux","Faute (États-Unis, Japon) · responsabilité objective (la plupart des États UE) · objective limitée + illimitée pour faute (Allemagne, Autriche) · objective illimitée (common law, France, Suède).","Loi applicable dans l'UE : Rome II art. 4(1), lieu du dommage.","En clair : chaque pays a son système pour les tiers au sol.\n\nAstuce : l'Allemagne est le modèle à détailler (LuftVG)."];
FR[212]=["Allemagne : §§ 33 s. LuftVG","Tout dommage sur le territoire allemand, objectif, la causalité suffit. Plafonds selon la MTOW 750 000 → 700 M DTS (2/3 dommages corporels, 1/3 matériels) ; illimité en cas de faute.","Calque les classes d'assurance de l'art. 7 du Règl. 785/2004.","En clair : modèle mixte, objectif avec plafond, illimité si faute.\n\nPourquoi : exemple concret du droit national qui remplace Rome."];
FR[213]=["Les Conventions de 2009 (pas en vigueur)","Risques généraux : objectif jusqu'aux plafonds MTOW, illimité au-delà sauf absence de négligence (deux paliers type Montréal). Intervention illicite : exploitant + fonds financé par les passagers, jusqu'à 3,7 Md DTS au total.","Les deux exigent 35 ratifications ; la UIC avait 10 parties (oct. 2025).","En clair : conçues après le 11 septembre, jamais entrées en vigueur.\n\nPiège : ne pas les appliquer comme droit positif.\n\nAstuce : critique — faire payer le terrorisme aux passagers."];
FR[214]=["Un avion immatriculé en Allemagne s'écrase sur des maisons en Allemagne. Rome 1952 ?","Non : l'Allemagne n'est pas partie et l'avion n'est pas étranger. Le LuftVG s'applique : objectif, plafonné selon la MTOW, illimité en cas de faute.","","En clair : double raison d'exclure Rome.\n\nAstuce : MC99 pour les passagers à bord, LuftVG pour les victimes au sol."];
FR[215]=["Faire sauter les plafonds de Rome pour faute lourde","Seulement un acte délibéré visant à causer un dommage.","","En clair : critère beaucoup plus strict que MC99 (témérité).\n\nAstuce : Rome = intention ; MC99 retard/bagages = dol ou témérité."];
FR[216]=["Quelle directive s'applique ?","Directive 85/374 → directive (UE) 2024/2853, applicable aux produits mis sur le marché après le 8.12.2026. Les avions déjà en service restent sous l'ancien régime (Royaume-Uni : Consumer Protection Act 1987).","","En clair : la date de mise sur le marché décide.\n\nPiège : appliquer la nouvelle directive à un avion livré avant décembre 2026."];
FR[217]=["Produit (art. 4 nouvelle directive)","Tous les meubles, y compris les logiciels (SaaS aussi), fichiers de fabrication numérique, matières premières, électricité, composants, services connexes.","Pas la simple information ; pas les logiciels libres hors activité commerciale.","En clair : le logiciel devient un produit.\n\nPourquoi : crucial pour l'aviation automatisée et les drones."];
FR[218]=["Défaut (art. 7 nouvelle directive)","Absence de la sécurité à laquelle on peut légitimement s'attendre ou exigée par le droit. Neuf circonstances dont l'auto-apprentissage, l'interconnexion, la cybersécurité, les rappels.","Pas défectueux du seul fait qu'un meilleur produit ou une mise à jour existe.","En clair : on juge la sécurité attendue, pas la perfection.\n\nAstuce : citer 2–3 des neuf circonstances."];
FR[219]=["Dommage (art. 6 nouvelle directive)","Décès, lésion y compris préjudice psychologique médicalement reconnu ; biens sauf le produit lui-même et les biens à usage exclusivement professionnel ; données non professionnelles détruites.","","En clair : pas de réparation pour l'avion défectueux lui-même.\n\nAstuce : comparer avec Laudamotion (psychique)."];
FR[220]=["Personnes responsables (art. 8)","Fabricant (produit et composant) · fabricant hors UE → importateur, mandataire, puis prestataire de services d'exécution · modificateur substantiel · distributeur muet > 1 mois · plateformes (DSA 6(3)).","Responsabilité solidaire (art. 12).","En clair : il y a toujours quelqu'un dans l'UE à attaquer.\n\nExemple MediLift : QJI (fabricant chinois) + Torenhoge (importateur)."];
FR[221]=["Exonérations de l'ancienne directive (art. 7 85/374)","(a) pas mis en circulation · (b) défaut inexistant à ce moment · (c) pas destiné à la vente · (d) conformité à des règles impératives · (e) risque de développement · (f) composant : conception du produit final.","","En clair : six défenses, interprétées strictement.\n\nAstuce : (d) et (e) sont les plus discutées en aviation."];
